mybatis.type-aliases-package=vip.xiaozhao.intern.baseUtil.intf.entity

#log
logging.config=classpath:logback-spring.xml
logging.structured.max-message-length=${LOG_MAX_MESSAGE_LENGTH:2048}
logging.error-sample-interval-ms=${LOG_ERROR_SAMPLE_INTERVAL_MS:10000}
logging.request-context.enabled=${LOGGING_REQUEST_CONTEXT_ENABLED:true}
#dev test prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==================== JWT闂佹澘绉堕悿?====================
jwt.secret=${JWT_SECRET:}
jwt.issuer=${JWT_ISSUER:intern-base}
jwt.expiration=86400000
# 仅 DevAuthController 使用；生产 Profile 不加载演示登录接口。
demo.auth.password=${DEMO_AUTH_PASSWORD:intern-demo}

# ==================== Actuator / Prometheus 闁烩晜鍨剁敮?====================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name:intern-base}



# ==================== System Notification ====================
system.notification.admin-ids=${ADMIN_IDS:1,2}


# ==================== Graceful Shutdown ====================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Dynamic detail cache warmup
cache.warmup.enabled=${CACHE_WARMUP_ENABLED:false}
cache.warmup.dynamic-limit=${CACHE_WARMUP_DYNAMIC_LIMIT:100}
