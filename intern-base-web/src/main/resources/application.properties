#cos info
cos.accessKeyId=${COS_ACCESS_KEY_ID:}
cos.accessKeySecret=${COS_ACCESS_KEY_SECRET:}
cos.mainBucket=${COS_BUCKET:newstep-1331140642}
cos.HostName=${COS_HOSTNAME:https://newstep-1331140642.cos.ap-guangzhou.myqcloud.com}
cos.region=ap-guangzhou

#url
home.url=http://127.0.0.1

#signKey
login.time.key=${LOGIN_TIME_KEY:}

# RabbitMQ runs on the cloud server for the current Win11 development topology.
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.connection-timeout=${RABBITMQ_CONNECTION_TIMEOUT_MS:5000}
spring.rabbitmq.requested-heartbeat=${RABBITMQ_HEARTBEAT_SECONDS:30}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.retry.enabled=false

# External dependency timeout and circuit-breaker policy.
cache.single-flight.wait-timeout-ms=${CACHE_SINGLE_FLIGHT_WAIT_TIMEOUT_MS:3000}
redis.connect-timeout-ms=${REDIS_CONNECT_TIMEOUT_MS:3000}
redis.command-timeout-ms=${REDIS_COMMAND_TIMEOUT_MS:5000}
resilience.circuit-breakers.redis.failure-rate-threshold=${REDIS_CB_FAILURE_RATE:50}
resilience.circuit-breakers.redis.slow-call-rate-threshold=${REDIS_CB_SLOW_CALL_RATE:80}
resilience.circuit-breakers.redis.slow-call-duration-threshold-ms=${REDIS_CB_SLOW_CALL_MS:5000}
resilience.circuit-breakers.redis.wait-duration-in-open-state-ms=${REDIS_CB_OPEN_WAIT_MS:30000}
resilience.circuit-breakers.redis.permitted-number-of-calls-in-half-open-state=${REDIS_CB_HALF_OPEN_CALLS:3}
resilience.circuit-breakers.redis.sliding-window-size=${REDIS_CB_WINDOW_SIZE:10}
resilience.circuit-breakers.redis.minimum-number-of-calls=${REDIS_CB_MIN_CALLS:5}
resilience.circuit-breakers.redis.automatic-transition-from-open-to-half-open=${REDIS_CB_AUTO_HALF_OPEN:true}

resilience.circuit-breakers.rabbit-mq.failure-rate-threshold=${RABBITMQ_CB_FAILURE_RATE:60}
resilience.circuit-breakers.rabbit-mq.slow-call-rate-threshold=${RABBITMQ_CB_SLOW_CALL_RATE:80}
resilience.circuit-breakers.rabbit-mq.slow-call-duration-threshold-ms=${RABBITMQ_CB_SLOW_CALL_MS:5000}
resilience.circuit-breakers.rabbit-mq.wait-duration-in-open-state-ms=${RABBITMQ_CB_OPEN_WAIT_MS:60000}
resilience.circuit-breakers.rabbit-mq.permitted-number-of-calls-in-half-open-state=${RABBITMQ_CB_HALF_OPEN_CALLS:5}
resilience.circuit-breakers.rabbit-mq.sliding-window-size=${RABBITMQ_CB_WINDOW_SIZE:10}
resilience.circuit-breakers.rabbit-mq.minimum-number-of-calls=${RABBITMQ_CB_MIN_CALLS:5}
resilience.circuit-breakers.rabbit-mq.automatic-transition-from-open-to-half-open=${RABBITMQ_CB_AUTO_HALF_OPEN:true}

cos.connection-timeout-ms=${COS_CONNECTION_TIMEOUT_MS:5000}
cos.socket-timeout-ms=${COS_SOCKET_TIMEOUT_MS:10000}
cos.connection-request-timeout-ms=${COS_CONNECTION_REQUEST_TIMEOUT_MS:3000}
cos.max-connections=${COS_MAX_CONNECTIONS:64}
cos.max-error-retry=${COS_MAX_ERROR_RETRY:2}
resilience.circuit-breakers.cos.failure-rate-threshold=${COS_CB_FAILURE_RATE:50}
resilience.circuit-breakers.cos.slow-call-rate-threshold=${COS_CB_SLOW_CALL_RATE:80}
resilience.circuit-breakers.cos.slow-call-duration-threshold-ms=${COS_CB_SLOW_CALL_MS:10000}
resilience.circuit-breakers.cos.wait-duration-in-open-state-ms=${COS_CB_OPEN_WAIT_MS:60000}
resilience.circuit-breakers.cos.permitted-number-of-calls-in-half-open-state=${COS_CB_HALF_OPEN_CALLS:3}
resilience.circuit-breakers.cos.sliding-window-size=${COS_CB_WINDOW_SIZE:10}
resilience.circuit-breakers.cos.minimum-number-of-calls=${COS_CB_MIN_CALLS:5}
resilience.circuit-breakers.cos.automatic-transition-from-open-to-half-open=${COS_CB_AUTO_HALF_OPEN:true}

# Transactional MQ outbox. Business writes and outbox rows share one MySQL transaction;
# the relay publishes committed rows asynchronously with a database lease.
mq.outbox.enabled=${MQ_OUTBOX_ENABLED:true}
mq.outbox.relay-enabled=${MQ_OUTBOX_RELAY_ENABLED:true}
mq.outbox.relay.fixed-delay-ms=${MQ_OUTBOX_RELAY_DELAY_MS:1000}
mq.outbox.batch-size=${MQ_OUTBOX_BATCH_SIZE:50}
mq.outbox.lease-seconds=${MQ_OUTBOX_LEASE_SECONDS:60}
mq.outbox.max-retry-count=${MQ_OUTBOX_MAX_RETRY_COUNT:10}
mq.outbox.retry-backoff-seconds=${MQ_OUTBOX_RETRY_BACKOFF_SECONDS:5}
mq.outbox.max-backoff-seconds=${MQ_OUTBOX_MAX_BACKOFF_SECONDS:300}

#MyBatis闂佹澘绉堕悿?
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=vip.xiaozhao.intern.baseUtil.intf.entity

#log
logging.config=classpath:logback-spring.xml
logging.structured.max-message-length=${LOG_MAX_MESSAGE_LENGTH:2048}
logging.error-sample-interval-ms=${LOG_ERROR_SAMPLE_INTERVAL_MS:10000}
#dev test prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==================== JWT闂佹澘绉堕悿?====================
jwt.secret=${JWT_SECRET:}
jwt.issuer=${JWT_ISSUER:intern-base}
