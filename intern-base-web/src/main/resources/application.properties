server.port=8080
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
envName=${APP_ENV:dev}

# Bound request concurrency so overload queues at the application edge instead of MySQL.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:20}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:200}

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:xiao}?characterEncoding=UTF8&serverTimezone=GMT%2B8
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource

# Flyway is the only runtime schema initializer. Keep automatic baselining
# disabled by default so a partially initialized legacy database fails fast.
spring.sql.init.mode=never
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}
spring.flyway.baseline-description=${FLYWAY_BASELINE_DESCRIPTION:legacy-init-schema}
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true
spring.flyway.create-schemas=false


#闁跨喐鏋婚幏宄邦潗闁跨喐鏋婚幏鐑芥晸閺傘倖瀚归柨鐔稿复鏉堢偓瀚圭亸?
spring.datasource.druid.initial-size=10
#闁跨喐鏋婚幏鐑芥晸閹恒儳顒查幏鐑芥晸閺傘倖瀚圭亸蹇涙晸閺傘倖瀚归柨鐔告灮閹?
spring.datasource.druid.min-idle=10
#闁跨喐鏋婚幏鐑芥晸閹恒儳顒查幏鐑芥晸閺傘倖瀚归柨鐔虹哺閻у憡瀚归柨鐔告灮閹风兘鏁撻弬銈嗗闁跨喐鏋婚幏鐑芥晸?
spring.datasource.druid.max-active=${DB_POOL_MAX_ACTIVE:64}
#闁跨喐鏋婚幏宄板絿闁跨喐鏋婚幏鐑芥晸閺傘倖瀚归柨鐔告灮閹风兘鏁撴楦挎彧閹烽攱妞傞柨鐔告灮閹?
spring.datasource.druid.max-wait=${DB_POOL_MAX_WAIT_MS:3000}
#闁跨喓娈曠拋瑙勫闁跨喐鏋婚幏鐑芥晸閺傘倖瀚归柨鐔告灮閹风兘鏁撻弬銈嗗闁跨喐鏋婚幏鐑芥晸?
spring.datasource.druid.remove-abandoned=true
#闁跨喐鏋婚幏鐑芥晸閺傘倖瀚归柨鐔告灮閹风兘鏁撻弬銈嗗闁跨喐鏋婚幏閿嬪閻椻€冲祱闁跨喓绮搁幉瀣闁?
spring.datasource.druid.remove-abandoned-timeout=180
# 闁跨喐鏋婚幏鐑芥晸閻偆銆嬮幏鐑芥晸閺傘倖瀚归柨鐔虹叓閹靛秵鏋婚幏鐑芥晸閺傘倖瀚规稉鈧柨鐔诲▏绾攱瀚归悮鎿冨墾閹风兘鏁撻弬銈嗗闁跨喐鏋婚幏鐤洣闁跨喐鍩呴梻顓犳畱閸栤剝瀚归柨鐔告灮閹风兘鏁撻弬銈嗗闁跨喐甯撮敐蹇斿闁跨喐鏋婚幏铚傜秴闁跨喐鏋婚幏鐑芥晸閺傘倖瀚?
spring.datasource.druid.min-evictable-idle-time-millis=60000
spring.datasource.druid.validationQuery=SELECT 1
spring.datasource.druid.test-while-idle=true
spring.datasource.druid.test-on-borrow=false
spring.datasource.druid.test-on-return=false


# Redis
# 鏈湴寮€鍙戦粯璁や娇鐢ㄥ崟鏈烘ā寮忥紱鐢熶骇鐜璇蜂娇鐢?Sentinel锛岄渶鍒嗙墖鏃跺啀鍒囧埌 Cluster
redis.mode=single
redis.ip=${REDIS_HOST:127.0.0.1}
redis.port=6379
redis.auth=${REDIS_AUTH:}
redis.database=${REDIS_DATABASE:4}
redis.timeOut=10000
# 鐢熶骇鎺ㄨ崘锛堥珮鍙敤锛夛細redis.mode=sentinel
# redis.sentinel.master=mymaster
